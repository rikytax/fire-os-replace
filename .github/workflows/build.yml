name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Rinomina APK
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk out/FireHome.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/FireHome-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FireHome-apk
          path: out/*.apk

      # Con un tag (es. v0.1.0) l'APK diventa scaricabile con un link diretto,
      # comodo per l'app "Downloader" sulla Fire Stick.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
