name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Rinomina APK
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk out/FireHome.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/FireHome-debug.apk
          (cd out && sha256sum FireHome.apk > FireHome.apk.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: FireHome-apk
          path: out/*

      # Pubblica (o aggiorna) la Release da cui lo script scarica FireHome.apk:
      # a ogni build riuscita su questo branch, e con un tag v*.
      - name: Release
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/ccr-59dd268d-hqgwa2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.0' }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
